name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no PyPI upload on manual runs)"
        required: true
        default: "9.13.13"

permissions:
  contents: read

jobs:
  build-cp38:
    name: Build cp38 (${{ matrix.os }})
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Pin tag version into setup.py
        shell: bash
        run: |
          python - "${{ steps.version.outputs.version }}" <<'PY'
          import sys
          ver = sys.argv[1]
          p = "bool-hybrid-array/setup.py"
          s = open(p, encoding="utf-8").read()
          marker = 'version="'
          i = s.index(marker)
          j = s.index('"', i + len(marker))
          s = s[:i + len(marker)] + ver + s[j:]
          open(p, "w", encoding="utf-8", newline="").write(s)
          PY

      - name: Write build constraints
        shell: bash
        run: printf 'cython<3.3\n' > "$GITHUB_WORKSPACE/constraints.txt"

      - name: Build cp38 wheel (cibuildwheel 2.23.4)
        shell: bash
        env:
          CIBW_BUILD: "cp38-*"
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux2014_x86_64:2025.04.19-1"
          CIBW_BEFORE_BUILD: 'python -m pip install "numpy>=1.19.0"'
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "PIP_CONSTRAINT=/project/constraints.txt"
          CIBW_ENVIRONMENT_MACOS: "PIP_CONSTRAINT=${{ github.workspace }}/constraints.txt"
          CIBW_ENVIRONMENT_WINDOWS: "PIP_CONSTRAINT=D:/a/bool-hybrid-array/bool-hybrid-array/constraints.txt"
        run: |
          python -m pip install --upgrade "cibuildwheel==2.23.4"
          python -m cibuildwheel bool-hybrid-array --output-dir wheelhouse 2>&1 | tee cibw.log

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-cp38-${{ matrix.os }}
          path: |
            wheelhouse/*.whl
            !wheelhouse/*py3-none*
          if-no-files-found: ignore

  build-wheels:
    name: Build wheels (${{ matrix.os }} ${{ matrix.pyver }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pyver: [cp39, cp310, cp311, cp312, cp313, cp314, cp315, cp314t, cp315t]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Pin tag version into setup.py
        shell: bash
        run: |
          python - "${{ steps.version.outputs.version }}" <<'PY'
          import sys
          ver = sys.argv[1]
          p = "bool-hybrid-array/setup.py"
          s = open(p, encoding="utf-8").read()
          marker = 'version="'
          i = s.index(marker)
          j = s.index('"', i + len(marker))
          s = s[:i + len(marker)] + ver + s[j:]
          open(p, "w", encoding="utf-8", newline="").write(s)
          PY

      - name: Write build constraints
        shell: bash
        run: printf 'cython<3.3\n' > "$GITHUB_WORKSPACE/constraints.txt"

      - name: Build wheel (cibuildwheel 4.3.0)
        shell: bash
        env:
          CIBW_BUILD: "${{ matrix.pyver }}-*"
          CIBW_MANYLINUX_X86_64_IMAGE: ${{ (matrix.pyver == 'cp39' || matrix.pyver == 'cp310' || matrix.pyver == 'cp311') && 'quay.io/pypa/manylinux_2_28_x86_64' || 'quay.io/pypa/manylinux_2_34_x86_64' }}
          CIBW_BEFORE_BUILD: 'python -m pip install "numpy>=1.19.0"'
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_ENVIRONMENT_LINUX: "PIP_CONSTRAINT=/project/constraints.txt"
          CIBW_ENVIRONMENT_MACOS: "PIP_CONSTRAINT=${{ github.workspace }}/constraints.txt"
          CIBW_ENVIRONMENT_WINDOWS: "PIP_CONSTRAINT=D:/a/bool-hybrid-array/bool-hybrid-array/constraints.txt"
        run: |
          python -m pip install --upgrade "cibuildwheel==4.3.0"
          python -m cibuildwheel bool-hybrid-array --output-dir wheelhouse 2>&1 | tee cibw.log

      - name: Regenerate C sources for diagnosis (Windows failure only)
        if: failure() && runner.os == 'Windows'
        shell: bash
        working-directory: bool-hybrid-array
        run: |
          python -m pip install "cython<3.3" "numpy>=1.19.0"
          python setup.py build_ext --inplace --force || true

      - name: Upload generated C sources (Windows failure only)
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: generated-c-${{ matrix.pyver }}
          path: bool-hybrid-array/bool_hybrid_array/**/*.c
          if-no-files-found: ignore

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.pyver }}
          path: |
            wheelhouse/*.whl
            !wheelhouse/*py3-none*
          if-no-files-found: ignore

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Pin tag version into setup.py
        shell: bash
        run: |
          python - "${{ steps.version.outputs.version }}" <<'PY'
          import sys
          ver = sys.argv[1]
          p = "bool-hybrid-array/setup.py"
          s = open(p, encoding="utf-8").read()
          marker = 'version="'
          i = s.index(marker)
          j = s.index('"', i + len(marker))
          s = s[:i + len(marker)] + ver + s[j:]
          open(p, "w", encoding="utf-8", newline="").write(s)
          PY

      - name: Build sdist into a fresh dir
        working-directory: bool-hybrid-array
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir ../sdist_out

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: sdist_out/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-cp38, build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
